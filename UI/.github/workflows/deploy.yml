name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Chạy khi push code vào nhánh main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-react-app:latest

  deploy-to-vps:
    needs: build-and-push # Chỉ chạy khi build xong
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Pull image mới nhất
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-react-app:latest
          
          # Dừng và xóa container cũ (nếu có)
          docker stop react-container || true
          docker rm react-container || true
          
          # Chạy container mới
          # Map port 80 của container ra port 80 (hoặc port khác nếu dùng Reverse Proxy ngoài)
          docker run -d --name react-container -p 80:80 ${{ secrets.DOCKER_USERNAME }}/my-react-app:latest