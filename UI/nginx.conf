server {
    listen 443 ssl;
    server_name www.quanlyhoctapsgu.cloud;

    # SSL Certificates (certbot đã cấp)
    ssl_certificate /etc/letsencrypt/live/www.quanlyhoctapsgu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.quanlyhoctapsgu.cloud/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Frontend (React)
    location / {
        try_files $uri /index.html;
    }

    # Proxy API → NodeJS Backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;  
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
