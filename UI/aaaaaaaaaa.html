<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <title>Caelio Banner Ngang</title>
  <style>
    body {
      margin: 0;
      width: 1200px;
      /* ~3m khi in (có thể phóng to khi xuất PDF) */
      height: 400px;
      /* ~1m khi in */
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "Segoe UI", Arial, sans-serif;
      box-sizing: border-box;
      padding: 20px 40px;
      color: #fff;
      background: linear-gradient(90deg, #2F4C7E 0%, #3A9188 100%);
      overflow: hidden;
    }

    /* Logo + slogan bên trái */
    .left {
      flex: 1;
      color: #fff;
    }

    .logo img {
      width: 120px;
      height: auto;
    }

    .title {
      font-size: 48px;
      font-weight: 800;
      margin: 20px 0 10px;
    }

    .tagline {
      font-size: 26px;
      font-weight: 500;
    }

    /* Nhân vật ở giữa */
    .center {
      flex: 2;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
    }

    .center img {
      max-height: 360px;
      width: auto;
    }

    /* QR + CTA bên phải */
    .right {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .qr img {
      width: 140px;
      height: 140px;
    }

    .cta {
      margin-top: 12px;
      font-size: 22px;
      font-weight: 600;
    }

    .footer {
      margin-top: 8px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <!-- Bên trái -->
  <div class="left">
    <div class="logo">
      <img src="assets/caelio-logo.png" alt="Caelio Logo">
    </div>
    <div class="title">Tìm sách hợp tính cách</div>
    <div class="tagline">Caelio – Đọc theo cách của bạn</div>
  </div>

  <!-- Giữa: nhân vật -->
  <div class="center">
    <img src="./nhanvat1.png" alt="Nhân vật 1">
    <img src="./nhanvat2.png" alt="Nhân vật 2">
    <img src="./nhanvat3.png" alt="Nhân vật 3">
    <img src="./nhanvat4.png" alt="Nhân vật 4">
    <img src="./nhanvat5.png" alt="Nhân vật 5">
    <img src="./nhanvat6.png" alt="Nhân vật 6">
  </div>

  <!-- Bên phải -->
  <div class="right">
    <div class="qr">
      <img src="assets/qrcode.png" alt="QR Code Caelio">
    </div>
    <div class="cta">Quét QR để khám phá ngay</div>
    <div class="footer">www.caelio.vn</div>
  </div>

</body>

</html>
