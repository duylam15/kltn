name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  # ================================
  # 1. BUILD CHECK (Kiểm tra lỗi code)
  # ================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---------- Backend Check ----------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend deps
        run: |
          cd myapp
          npm install

      # ---------- Frontend Check ----------
      - name: Install frontend deps
        run: |
          cd UI
          npm install

      - name: Build frontend test
        run: |
          cd UI
          npm run build

  # ================================
