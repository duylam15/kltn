  #             -p 3000:4000 \
  #             --env-file /root/myapp/.env \
  #             -v /root/myapp/private.key:/app/private.key \
  #             -v /root/myapp/public.key:/app/public.key \
  #             --restart unless-stopped \
  #             duylamdocker/myapp:latest

  # ================================
  # 3. DEPLOY FRONTEND (SCP) - MỚI
  # ================================
  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          cd UI
          npm install
          npm run build

      - name: Deploy Frontend to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }} # Sử dụng lại biến Host cũ hoặc điền 42.96.15.24
          username: ${{ secrets.SERVER_USER }} # root
          key: ${{ secrets.SERVER_SSH_KEY }}          
          port: 26266
          source: "UI/dist/*"
          target: "/root/frontend/"
          strip_components: 2 # Quan trọng: Loại bỏ UI/dist để file nằm trực tiếp trong /root/frontend/