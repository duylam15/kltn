name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---------- Backend ----------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend deps
        run: |
          cd myapp
          npm install

      # ---------- Frontend ----------
      - name: Install frontend deps
        run: |
          cd UI
          npm install

      - name: Build frontend
        run: |
          cd UI
          npm run build

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build image
        run: docker build -t duylamdocker/myapp:latest ./myapp

      - name: Push image
        run: docker push duylamdocker/myapp:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 26266
          script: |
            docker pull duylamdocker/myapp:latest
            docker stop myapp || true
            docker rm myapp || true
            docker run -d \
              --name myapp \
              --network myapp-network \
              -p 3000:4000 \
              --env-file /root/myapp/.env \
              -v /root/myapp/private.key:/app/private.key \
              -v /root/myapp/public.key:/app/public.key \
              --restart unless-stopped \
              duylamdocker/myapp:latest

